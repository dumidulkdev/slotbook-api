spring:
  datasource:
    url: jdbc:h2:mem:slotbook;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: dev-only-slotbook-jwt-secret-key-min-32-chars
    expiration-minutes: 480