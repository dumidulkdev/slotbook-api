services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: slotbook
      POSTGRES_USER: slotbook
      POSTGRES_PASSWORD: slotbook
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotbook -d slotbook"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: slotbook
      DB_USER: slotbook
      DB_PASSWORD: slotbook
      JWT_SECRET: change-me-to-a-long-random-production-secret
      JWT_EXPIRATION_MINUTES: 60
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy